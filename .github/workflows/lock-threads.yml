name: 'Lock Threads'

on:
  schedule:
    - cron: '16 9 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  discussions: write

concurrency:
  group: lock-threads

jobs:
  lock:
    uses: reactiveui/actions-common/.github/workflows/workflow-common-lock-threads.yml@main
    with:
      inactiveDays: 90
      lockReason: resolved
      excludeIssueLabel: help-wanted
      addIssueLabel: outdated
      postComment: false
